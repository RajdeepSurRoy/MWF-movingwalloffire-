name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Prints the battery report. The M2 gate (0 false positives, obvious attacks blocked)
      # is enforced by tests/harness/fixtures.test.ts in npm test. Persuasion is the planned
      # v1 bypass until the red team (M8), so --strict would fail on purpose for now.
      - run: npm run harness
